<meta name="twitter:card" content="summary" />

    <title>SportiLand | Play More. Plan Less.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>
  <body>
    <!-- React owns this root. No decorative startup/loader screen is rendered here. -->
    <div id="root"></div>
    <script>
      (function () {
        var root = document.getElementById('root');
        function escapeHtml(value) {
          return String(value).replace(/[&<>\"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', "'": '&#39;' }[c];
          });
        }
        function showBootError(message) {
          if (window.__sportilandMounted || !root || root.querySelector('[data-sportiland-boot-error]')) return;
          root.innerHTML = '<main data-sportiland-boot-error style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#f6f6f0;color:#11120f;font-family:Arial,sans-serif"><section style="width:min(640px,100%);padding:28px;border:1px solid #d8ddcb;border-radius:18px;background:#fff;box-shadow:0 18px 55px #11120f14"><b style="display:inline-block;padding:7px 11px;border-radius:30px;background:#c7ff3e;font-size:11px">SPORTILAND</b><h1 style="font-size:26px;margin:18px 0 8px">SportiLand could not start.</h1><p style="line-height:1.6;color:#53564e">A required app file failed to load. Start the project using the Vite development server, rather than opening index.html directly.</p><pre style="white-space:pre-wrap;overflow-wrap:anywhere;padding:14px;border-radius:10px;background:#171914;color:#d8ff83;font-size:12px">' + escapeHtml(message || 'The React application did not load.') + '</pre><p style="color:#77796f;font-size:12px">In the folder containing package.json, run <b>npm install</b> and then <b>npm run dev</b>.</p><button onclick="location.reload()" style="border:0;border-radius:9px;padding:12px 18px;background:#c7ff3e;font-weight:800;cursor:pointer">Retry</button></section></main>';
        }
        window.addEventListener('error', function (event) {
          if (!window.__sportilandMounted && (event.error || (event.target && event.target.tagName === 'SCRIPT'))) {
            showBootError(event.message || 'A required JavaScript file could not be loaded.');
          }
        }, true);
        window.addEventListener('unhandledrejection', function (event) {
          if (!window.__sportilandMounted) {
            showBootError(event.reason && (event.reason.message || String(event.reason)) || 'A startup request failed.');
          }
        });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
